<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Bad UX — fixture pra usabilidade-br</title>
<style>
  body { font-family: Arial; margin: 20px; }
  .btn { padding: 8px 16px; cursor: pointer; }
  .btn-primary { background: #3366ff; color: white; border: none; }
  .btn-danger { background: #3366ff; color: white; border: none; }
  .icon-only { background: none; border: none; cursor: pointer; font-size: 20px; }
  input { padding: 6px; border: 1px solid #ccc; }
  .modal { position: fixed; top: 50%; left: 50%;
           transform: translate(-50%, -50%); background: white;
           padding: 24px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h1>Bem-vindo Ao Painel De Controle</h1>

<nav>
  <a href="#">Home</a>
  <a href="#">Settings</a>
  <a href="#">Logout</a>
</nav>

<section>
  <h2>Submit Your Application</h2>
  <p>Vibrante plataforma "inovadora" que serve como uma prova do nosso compromisso. 🚀💡✅</p>

  <form id="payment-form" onsubmit="event.preventDefault(); alert('Erro')">
    <input type="text" placeholder="Email">
    <input type="text" placeholder="CPF">
    <input type="text" placeholder="Senha">
    <button class="btn btn-primary" type="submit">Submit</button>
    <button class="btn btn-danger" type="button" onclick="document.getElementById('payment-form').remove()">Delete</button>
  </form>
</section>

<section>
  <h2>Suas Ações</h2>
  <button class="icon-only">🗑</button>
  <button class="icon-only">⚙</button>

</section>

</section>

<div class="modal" id="confirm-modal" style="display:none">
  <p>Are you sure?</p>
  <button class="btn btn-primary" onclick="document.body.innerHTML=''">OK</button>
</div>

<footer>
  <small>Última atualização: 2026-05-18T14:32:00Z</small>
</footer>
