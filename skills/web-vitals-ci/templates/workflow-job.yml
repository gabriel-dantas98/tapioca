# Fragment: add under `jobs:` in an existing GitHub Actions CI workflow.
# Adapt Node version, package manager, and Chromium install to the target repo.
#
# Chrome / sandbox (confirmed: 3Dantas PR #82 @ 8f2b417):
# - Playwright Chromium on ubuntu-latest → "No usable sandbox!" without flags.
# - LHCI NodeRunner ONLY forwards collect.settings.chromeFlags
#   (@lhci/cli/src/collect/node-runner.js). Top-level collect.chromeFlags
#   is ignored — never put sandbox flags only there.
# - Required in lighthouserc.cjs:
#     settings.chromeFlags: '--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage'
#
# Vite preview: NO_COLOR=1 and ready-match the listen URL/port (not "Local:").

  web-vitals:
    name: web-vitals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run Web Vitals gate
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run test:web-vitals

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lhci-reports
          path: |
            output/lhci
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 7
