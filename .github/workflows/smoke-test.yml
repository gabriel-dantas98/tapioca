name: smoke-test

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.agents/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/smoke-test.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  token-free:
    name: token-free (structure + python + claude validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: validate plugin structure
        run: bash scripts/validate-plugin-structure.sh
      - name: google-sheets static eval
        run: python3 skills/google-sheets-apps-script/evals/run_static.py
      - name: multi-gen python smoke
        run: python3 skills/multi-gen/tests/smoke_test.py
      - name: install claude CLI
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: claude plugin validate + marketplace harness
        run: |
          # Estrutura já validada acima; evita rodar validate-plugin-structure de novo no CI.
          bash .agents/skills/smoke-test-skills/run.sh marketplace-claude | tee plugin-validate.txt
          if grep -q '^✘' plugin-validate.txt; then
            echo "::error::claude plugin validate found errors"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-validate-output
          path: |
            plugin-validate.txt
            /tmp/tapioca-smoke/

  claude-oneshot:
    name: claude CLI one-shot (humanizer-br)
    runs-on: ubuntu-latest
    needs: token-free
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: detect secret
        id: gate
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping paid one-shot job"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - name: install claude CLI
        if: steps.gate.outputs.skip == 'false'
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: run skill one-shot (harness)
        if: steps.gate.outputs.skip == 'false'
        run: |
          bash .agents/skills/smoke-test-skills/run.sh oneshot humanizer-br claude
          echo "--- claude output (first 80 lines) ---"
          head -80 /tmp/tapioca-smoke/humanizer-br-claude.txt

  cursor-oneshot:
    name: cursor-agent one-shot (humanizer-br)
    runs-on: ubuntu-latest
    needs: token-free
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
    steps:
      - name: detect secret
        id: gate
        run: |
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CURSOR_API_KEY not set — skipping paid one-shot job"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - name: install cursor-agent
        if: steps.gate.outputs.skip == 'false'
        run: curl https://cursor.com/install -fsS | bash
      - name: run skill one-shot (harness)
        if: steps.gate.outputs.skip == 'false'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash .agents/skills/smoke-test-skills/run.sh oneshot humanizer-br cursor
          echo "--- cursor-agent output (first 80 lines) ---"
          head -80 /tmp/tapioca-smoke/humanizer-br-cursor.txt