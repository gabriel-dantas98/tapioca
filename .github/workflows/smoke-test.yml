name: smoke-test

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.agents/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/smoke-test.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (json + shell + refs + decoupling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: json válido (todos os manifestos)
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   .cursor-plugin/plugin.json .cursor-plugin/marketplace.json; do
            jq -e . "$f" >/dev/null && echo "ok $f"
          done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck .agents/skills/smoke-test-skills/run.sh scripts/*.sh
      - name: refs canônicos (@.path) em .md resolvem
        run: |
          rc=0
          while IFS= read -r -d '' file; do
            while IFS= read -r ref; do
              p="${ref#@}"; p="${p%/}"
              if [ -n "$p" ] && [ ! -e "$p" ]; then
                echo "::error::$file referencia path inexistente: @$p"; rc=1
              fi
            done < <(grep -Eo '@\.[A-Za-z0-9._/-]+' "$file" | sort -u || true)
          done < <(find . -path ./.git -prune -o -type f -name '*.md' -print0)
          exit $rc
      - name: guard de desacoplamento (sem dependência externa proibida)
        run: |
          if grep -ril maritaca --include='*.md' --include='*.json' --include='*.html' --include='*.py' --include='*.sh' . | grep -v '.git/'; then
            echo "::error::referência a serviço externo desacoplado encontrada — capabilities rodam no Claude/CLI por padrão (constituição §5)"
            exit 1
          fi
          echo "sem acoplamento externo proibido"

  conformance:
    name: conformance (DESIGN.md + skills + exec bits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toda skill shippada tem SKILL.md + DESIGN.md com name correto
        run: |
          for dir in skills/*/; do
            name="$(basename "$dir")"
            test -f "$dir/SKILL.md"  || { echo "::error::$dir sem SKILL.md"; exit 1; }
            test -f "$dir/DESIGN.md" || { echo "::error::$dir sem DESIGN.md (constituição §4)"; exit 1; }
            grep -q "^name: $name$" "$dir/SKILL.md" || { echo "::error::$dir/SKILL.md: name != $name"; exit 1; }
          done
          echo "skills conformes"
      - name: harness de smoke é executável
        run: |
          test -x .agents/skills/smoke-test-skills/run.sh || { echo "::error::run.sh não é executável"; exit 1; }
          echo "run.sh executável"

  validate-manifest:
    name: validate plugin.json + frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse manifest
        run: |
          jq -e '.name == "tapioca" and (.version | length > 0)' .claude-plugin/plugin.json
          echo "plugin.json OK"
      - name: marketplace manifests present + valid
        run: |
          jq -e '.name == "tapioca" and (.plugins | length > 0) and (.plugins[0].source == "./")' .claude-plugin/marketplace.json
          jq -e '.name == "tapioca" and (.plugins | length > 0) and (.plugins[0].source == "./")' .cursor-plugin/marketplace.json
          jq -e '.skills == "./skills/" and .agents == "./agents/"' .cursor-plugin/plugin.json
          echo "marketplace manifests OK"
      - name: skill frontmatter exists
        run: |
          for skill in humanizer-br usabilidade-br multi-gen; do
            test -f "skills/$skill/SKILL.md"
            head -1 "skills/$skill/SKILL.md" | grep -q '^---$'
            grep -q "^name: $skill$" "skills/$skill/SKILL.md"
            grep -q '^description:' "skills/$skill/SKILL.md"
          done
      - name: agent frontmatter exists
        run: |
          for agent in humanizer-br usabilidade-br; do
            test -f "agents/$agent.md"
            head -1 "agents/$agent.md" | grep -q '^---$'
          done
      - name: usabilidade-br fixture present
        run: |
          test -f tests/fixtures/usabilidade-br/bad-page.html
          test -f tests/fixtures/usabilidade-br/expected-violations.md
      - name: multi-gen scripts present
        run: |
          test -f skills/multi-gen/run_engines.py
          test -f skills/multi-gen/build_preview.py
          test -f skills/multi-gen/DESIGN.md
          test -f skills/multi-gen/tests/smoke_test.py

  multi-gen-smoke:
    name: multi-gen python smoke (token-free)
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run multi-gen smoke test
        run: python3 skills/multi-gen/tests/smoke_test.py

  claude-plugin-validate:
    name: claude plugin validate (token-free)
    runs-on: ubuntu-latest
    needs: [lint, conformance, validate-manifest]
    steps:
      - uses: actions/checkout@v4
      - name: install claude CLI
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: run native validator
        run: |
          # 'claude plugin validate' does structural + schema validation
          # without making API calls. Catches: YAML frontmatter parse errors,
          # missing required fields, invalid component structure, marketplace
          # manifest mismatches. Returns non-zero on hard errors; warnings
          # are reported but don't fail the build.
          claude plugin validate . | tee plugin-validate.txt
          # Hard errors print '✘'; we explicitly fail if any error is shown.
          if grep -q '^✘' plugin-validate.txt; then
            echo "::error::claude plugin validate found errors"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-validate-output
          path: plugin-validate.txt

  claude-oneshot:
    name: claude CLI one-shot (humanizer-br)
    runs-on: ubuntu-latest
    needs: claude-plugin-validate
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: detect secret
        id: gate
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping paid one-shot job"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - name: install claude CLI
        if: steps.gate.outputs.skip == 'false'
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: run skill one-shot + verify (shared harness)
        if: steps.gate.outputs.skip == 'false'
        run: |
          .agents/skills/smoke-test-skills/run.sh humanizer-br claude
          echo "--- claude output (first 80 lines) ---"
          head -80 /tmp/tapioca-smoke/humanizer-br-claude.txt

  cursor-oneshot:
    name: cursor-agent one-shot (humanizer-br)
    runs-on: ubuntu-latest
    needs: claude-plugin-validate
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
    steps:
      - name: detect secret
        id: gate
        run: |
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CURSOR_API_KEY not set — skipping paid one-shot job"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - name: install cursor-agent
        if: steps.gate.outputs.skip == 'false'
        run: curl https://cursor.com/install -fsS | bash
      - name: run skill one-shot + verify (shared harness)
        if: steps.gate.outputs.skip == 'false'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          .agents/skills/smoke-test-skills/run.sh humanizer-br cursor
          echo "--- cursor-agent output (first 80 lines) ---"
          head -80 /tmp/tapioca-smoke/humanizer-br-cursor.txt
