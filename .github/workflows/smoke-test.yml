name: smoke-test

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - '.claude-plugin/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/smoke-test.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifest:
    name: validate plugin.json + frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse manifest
        run: |
          jq -e '.name == "tapioca" and (.version | length > 0)' .claude-plugin/plugin.json
          echo "manifest OK"
      - name: skill frontmatter exists
        run: |
          test -f skills/humanizer-br/SKILL.md
          head -1 skills/humanizer-br/SKILL.md | grep -q '^---$'
          grep -q '^name: humanizer-br$' skills/humanizer-br/SKILL.md
          grep -q '^description:' skills/humanizer-br/SKILL.md
      - name: agent frontmatter exists
        run: |
          test -f agents/humanizer-br.md
          head -1 agents/humanizer-br.md | grep -q '^---$'

  claude-plugin-validate:
    name: claude plugin validate (token-free)
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - name: install claude CLI
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: run native validator
        run: |
          # 'claude plugin validate' does structural + schema validation
          # without making API calls. Catches: YAML frontmatter parse errors,
          # missing required fields, invalid component structure, marketplace
          # manifest mismatches. Returns non-zero on hard errors; warnings
          # are reported but don't fail the build.
          claude plugin validate . | tee plugin-validate.txt
          # Hard errors print '✘'; we explicitly fail if any error is shown.
          if grep -q '^✘' plugin-validate.txt; then
            echo "::error::claude plugin validate found errors"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-validate-output
          path: plugin-validate.txt

  claude-oneshot:
    name: claude CLI one-shot (humanizer-br)
    runs-on: ubuntu-latest
    needs: claude-plugin-validate
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: detect secret
        id: gate
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping paid one-shot job"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - name: install claude CLI
        if: steps.gate.outputs.skip == 'false'
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: run skill one-shot
        if: steps.gate.outputs.skip == 'false'
        run: |
          PROMPT="Use a skill /tapioca:humanizer-br para analisar e humanizar o texto em tests/fixtures/ai-flavored.md. Liste os padrões de IA detectados no texto (mencione cada categoria pelo nome) e em seguida apresente a versão reescrita. Não use emojis no output."
          claude --print --plugin-dir . "$PROMPT" > /tmp/claude-output.txt
          echo "--- claude output (first 80 lines) ---"
          head -80 /tmp/claude-output.txt
      - name: verify detection
        if: steps.gate.outputs.skip == 'false'
        run: bash scripts/check-output.sh /tmp/claude-output.txt

  cursor-oneshot:
    name: cursor-agent one-shot (humanizer-br)
    runs-on: ubuntu-latest
    needs: claude-plugin-validate
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
    steps:
      - name: detect secret
        id: gate
        run: |
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CURSOR_API_KEY not set — skipping paid one-shot job"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - name: install cursor-agent
        if: steps.gate.outputs.skip == 'false'
        run: curl https://cursor.com/install -fsS | bash
      - name: run skill one-shot
        if: steps.gate.outputs.skip == 'false'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          PROMPT="Leia tests/fixtures/ai-flavored.md, leia skills/humanizer-br/SKILL.md, e aplique a skill no texto da fixture. Liste os padrões de IA detectados (mencione cada categoria pelo nome) e em seguida apresente a versão reescrita. Não use emojis no output."
          cursor-agent --print --trust --sandbox disabled "$PROMPT" > /tmp/cursor-output.txt
          echo "--- cursor-agent output (first 80 lines) ---"
          head -80 /tmp/cursor-output.txt
      - name: verify detection
        if: steps.gate.outputs.skip == 'false'
        run: bash scripts/check-output.sh /tmp/cursor-output.txt
