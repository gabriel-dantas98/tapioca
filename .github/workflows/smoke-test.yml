name: smoke-test

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.agents/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/smoke-test.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifest:
    name: validate plugin.json + frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse manifest
        run: |
          jq -e '.name == "tapioca" and (.version | length > 0)' .claude-plugin/plugin.json
          echo "plugin.json OK"
      - name: marketplace manifests present + valid
        run: |
          jq -e '.name == "tapioca" and (.plugins | length > 0) and (.plugins[0].source == "./")' .claude-plugin/marketplace.json
          jq -e '.name == "tapioca" and (.plugins | length > 0) and (.plugins[0].source == "./")' .cursor-plugin/marketplace.json
          jq -e '.skills == "./skills/" and .agents == "./agents/"' .cursor-plugin/plugin.json
          echo "marketplace manifests OK"
      - name: skill frontmatter exists
        run: |
          for skill in humanizer-br usabilidade-br multi-gen google-sheets-apps-script aws-secrets; do
            test -f "skills/$skill/SKILL.md"
            head -1 "skills/$skill/SKILL.md" | grep -q '^---$'
            grep -q "^name: $skill$" "skills/$skill/SKILL.md"
            grep -q '^description:' "skills/$skill/SKILL.md"
          done
      - name: agent frontmatter exists
        run: |
          for agent in humanizer-br usabilidade-br; do
            test -f "agents/$agent.md"
            head -1 "agents/$agent.md" | grep -q '^---$'
          done
      - name: usabilidade-br fixture present
        run: |
          test -f tests/fixtures/usabilidade-br/bad-page.html
          test -f tests/fixtures/usabilidade-br/expected-violations.md
      - name: multi-gen scripts present
        run: |
          test -f skills/multi-gen/run_engines.py
          test -f skills/multi-gen/build_preview.py
          test -f skills/multi-gen/DESIGN.md
          test -f skills/multi-gen/tests/smoke_test.py
      - name: google-sheets-apps-script present
        run: |
          test -f skills/google-sheets-apps-script/scripts/sheets_agent.py
          test -f skills/google-sheets-apps-script/templates/Code.gs
          test -f skills/google-sheets-apps-script/DESIGN.md
          test -f skills/google-sheets-apps-script/evals/run_static.py
      - name: aws-secrets present
        run: |
          test -f skills/aws-secrets/package-lock.json
          test -f skills/aws-secrets/DESIGN.md
          test -f skills/aws-secrets/scripts/bootstrap.sh
          test -f skills/aws-secrets/evals/evals.json
          test -x skills/aws-secrets/evals/run_behavior.ts

  aws-secrets-node:
    name: aws-secrets Node tests + evals
    runs-on: ubuntu-latest
    needs: validate-manifest
    defaults:
      run:
        working-directory: skills/aws-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skills/aws-secrets/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run eval
      - run: bash tests/bootstrap.test.sh

  aws-secrets-ui:
    name: aws-secrets Playwright
    runs-on: ubuntu-latest
    needs: validate-manifest
    defaults:
      run:
        working-directory: skills/aws-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skills/aws-secrets/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:ui -- --reporter=line

  google-sheets-static:
    name: google-sheets static eval (token-free)
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run static eval
        run: python3 skills/google-sheets-apps-script/evals/run_static.py

  multi-gen-smoke:
    name: multi-gen python smoke (token-free)
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run multi-gen smoke test
        run: python3 skills/multi-gen/tests/smoke_test.py

  claude-plugin-validate:
    name: claude plugin validate (token-free)
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - name: install claude CLI
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: run native validator + marketplace harness
        run: |
          # Fonte unica: .agents/skills/smoke-test-skills/run.sh marketplace
          # Cobre: claude plugin validate, jq shapes, marketplace add ./, symlink Cursor local
          bash .agents/skills/smoke-test-skills/run.sh marketplace | tee plugin-validate.txt
          if grep -q '^✘' plugin-validate.txt; then
            echo "::error::claude plugin validate found errors"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-validate-output
          path: |
            plugin-validate.txt
            /tmp/tapioca-smoke/

  claude-oneshot:
    name: claude CLI one-shot (shipped prompts)
    runs-on: ubuntu-latest
    needs: claude-plugin-validate
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: detect secret
        id: gate
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping paid one-shot job"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - name: install claude CLI
        if: steps.gate.outputs.skip == 'false'
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: run skill one-shot (harness)
        if: steps.gate.outputs.skip == 'false'
        run: |
          bash .agents/skills/smoke-test-skills/run.sh oneshot humanizer-br claude
          bash .agents/skills/smoke-test-skills/run.sh oneshot aws-secrets claude
          echo "--- claude output (first 80 lines) ---"
          head -80 /tmp/tapioca-smoke/humanizer-br-claude.txt
          head -80 /tmp/tapioca-smoke/aws-secrets-claude.txt

  cursor-oneshot:
    name: cursor-agent one-shot (shipped prompts)
    runs-on: ubuntu-latest
    needs: claude-plugin-validate
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
    steps:
      - name: detect secret
        id: gate
        run: |
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CURSOR_API_KEY not set — skipping paid one-shot job"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
      - name: install cursor-agent
        if: steps.gate.outputs.skip == 'false'
        run: curl https://cursor.com/install -fsS | bash
      - name: run skill one-shot (harness)
        if: steps.gate.outputs.skip == 'false'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash .agents/skills/smoke-test-skills/run.sh oneshot humanizer-br cursor
          bash .agents/skills/smoke-test-skills/run.sh oneshot aws-secrets cursor
          echo "--- cursor-agent output (first 80 lines) ---"
          head -80 /tmp/tapioca-smoke/humanizer-br-cursor.txt
          head -80 /tmp/tapioca-smoke/aws-secrets-cursor.txt
